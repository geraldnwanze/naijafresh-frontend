name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build --webpack

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    env:
      # playwright.config.ts looks here, so install the browser in the same place.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.playwright-browsers

    steps:
      - uses: actions/checkout@v4

      # The tests need the API. If the backend repository is private, add a
      # read-only personal access token as the BACKEND_REPO_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: geraldnwanze/naijafresh-backend
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_pgsql, pgsql, bcmath, zip
          coverage: none

      - name: Install the backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Make the PostgreSQL tools available
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"

      - name: Run Playwright
        run: npx playwright test
        env:
          CI: "true"
          BACKEND_DIR: ${{ github.workspace }}/backend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
